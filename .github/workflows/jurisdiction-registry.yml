name: Jurisdiction policy registry check

# Fails when the Robinhood Stock Token issuer registry lists a chain-4663 asset
# that src/jurisdiction-policy.json does not classify. Such an asset is already
# held by the policy (unclassified); this check is what tells us to classify it.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check issuer registry against the policy
        run: node script/generate-jurisdiction-policy.mjs --check
