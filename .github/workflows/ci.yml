name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Build, test, and bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        id: type-check
        background: true
        run: bun run build

      - name: Test
        id: test
        background: true
        run: bun run test

      # The bundle check writes Wrangler's temporary bundle under .wrangler/,
      # which ESLint would also lint, so it runs after lint finishes.
      - name: Lint
        run: bun run lint

      - name: Validate Cloudflare bundle
        run: bun run check

      - name: Wait for type-check and tests
        wait: [type-check, test]
